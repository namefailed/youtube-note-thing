# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail the build on known security vulnerabilities and unmaintained crates.
# In the v2 schema all vulnerability advisories are errors; `unmaintained = "all"`
# extends that to every unmaintained crate (direct or transitive).
version = 2
unmaintained = "all"
yanked = "deny"

[bans]
# Warn (don't fail) when the same crate is pulled in at multiple versions.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Fail on any license outside this permissive allow-list.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
