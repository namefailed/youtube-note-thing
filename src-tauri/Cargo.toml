[package]
name = "youtube-note-thing"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "ytnt_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "youtube-note-thing"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Smaller, faster shipped binary. panic strategy left at default (unwind) so
# Tauri's per-command panic isolation keeps working.
[profile.release]
strip = true
lto = true
codegen-units = 1
