name: Release

# Tag a version (e.g. v0.1.0) and push it to build, sign, and draft a GitHub
# release with the installer + updater artifacts (latest.json). Requires the
# signing secrets below — see RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Generate with `npm run tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: bundle the app's default Google OAuth client (build.rs reads these).
          YTNT_GOOGLE_CLIENT_ID: ${{ secrets.YTNT_GOOGLE_CLIENT_ID }}
          YTNT_GOOGLE_CLIENT_SECRET: ${{ secrets.YTNT_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "youtube-note-thing ${{ github.ref_name }}"
          releaseBody: "Download the installer below. Auto-update is delivered via latest.json."
          releaseDraft: true
          prerelease: false
